<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Random Video Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Random Video Chat</h1>
    <p id="status">Press Start to find a random person.</p>
    <section class="videos">
      <div><span>You</span><video id="local" autoplay muted playsinline></video></div>
      <div><span>Stranger</span><video id="remote" autoplay playsinline></video></div>
    </section>
    <div class="controls">
      <button id="start">Start</button>
      <button id="next" disabled>Next</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <p class="note">Camera/microphone access requires HTTPS in production (localhost works for development).</p>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
