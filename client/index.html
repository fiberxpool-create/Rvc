<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Random Video Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Random Video Chat</h1>
        <p id="status">Press Start to find a random person.</p>
      </div>
      <div class="online-dot"><span></span> Live</div>
    </header>

    <section class="videos">
      <div class="video-card">
        <span class="label">You</span>
        <video id="local" autoplay muted playsinline></video>
      </div>
      <div class="video-card">
        <span class="label">Stranger</span>
        <video id="remote" autoplay playsinline></video>
        <div id="remotePlaceholder" class="placeholder">Waiting for a stranger…</div>
      </div>
    </section>

    <div class="controls">
      <button id="start" class="primary">Start</button>
      <button id="next" disabled>Next</button>
      <button id="stop" disabled>Stop</button>
    </div>

    <section class="chat">
      <div class="chat-header">
        <strong>Chat</strong>
        <span id="chatState">Not connected</span>
      </div>
      <div id="messages" class="messages">
        <div class="empty-chat">Messages will appear here when you're matched.</div>
      </div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" maxlength="500" autocomplete="off"
               placeholder="Type a message…" disabled>
        <button id="sendBtn" type="submit" disabled>Send</button>
      </form>
    </section>

    <p class="privacy">Your video/audio uses WebRTC. Chat messages are relayed only to your current matched stranger.</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
